name: Monthly backup
on:
  schedule:
    - cron: '30 21 1 * *'   # 21:30 UTC on the 1st = 3:00 a.m. on the 2nd in India
  workflow_dispatch:        # lets you run it by hand: Actions > Monthly backup > Run workflow
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make and email the backup
        run: node backup/monthly-backup.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BACKUP_TO: ${{ secrets.BACKUP_TO }}
          BACKUP_FROM: ${{ secrets.BACKUP_FROM }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - name: Keep an encrypted copy in GitHub for 90 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfss-backup
          path: backup-output/*.enc
          retention-days: 90
          if-no-files-found: ignore
